title: slogging
tagline: Configure, ship and search Go's log/slog
description: A Go library for log/slog that configures the default logger from environment variables and adds handlers for Loki and a searchable in-memory ring.
lang: en
url: https://psyb0t.github.io
baseurl: /slogging
repository: psyb0t/slogging
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/slogging
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/slogging/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/slogging
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
